# Builds and deploys stencil to GitHub Pages on every push to main.
#
# Once this is live, a push to main is a deploy — see CLAUDE.md's git rules. `npm test` runs
# first and is not a formality: the failures it catches are a wrong fact or a leftover placeholder
# in a notice, both of which look fine in a diff and wrong in a document sent to owners.
#
# Uses the "deploy from a workflow" Pages method (actions/deploy-pages), not a gh-pages branch,
# so the repo's Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push wins rather than queuing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: the shared palette lives in vendor/strata-kit and the stylesheet imports it.
      # Without this the import resolves to nothing and the site deploys unstyled.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Vite doesn't know about CNAME (it isn't under public/); Pages needs it beside index.html
      # in the published artifact to serve the custom domain.
      - run: cp CNAME dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
